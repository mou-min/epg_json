name: EPG

on:
  schedule:
    - cron: 0 4,10,22 * * *
    - cron: 39 15,16 * * *
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - url: https://epg.112114.xyz/pp.xml.gz
            branch: 112114
            sleep: 0s
          - url: https://e.erw.cc/e.xml.gz
            branch: erw
            sleep: 30s
          #- url: http://epg.51zmt.top:8000/e.xml
          #  branch: 51zmt
          #  sleep: 60s

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Download Files
        run: |
          wget https://raw.githubusercontent.com/${{ github.repository }}/${{ matrix.branch }}/md5.txt -O md5.txt
          url="${{ matrix.url }}"
          if [[ "$url" == *".gz" ]]; then
            echo "URL is a gzipped file"
            wget $url -O e.xml.gz
            gzip -df e.xml.gz
          else
            echo "URL is a plain XML file"
            wget $url -O e.xml
          fi

      - name: Check MD5
        run: |
          md5=$(md5sum ./e.xml | awk '{print $1}')
          if ! grep -q "$md5" ./md5.txt; then
            echo "isDiff=$md5" >> $GITHUB_ENV
            now_time=$(date -u -d '+8 hour' '+%Y-%m-%d %H:%M:%S')
            echo "now_time=$now_time" >> $GITHUB_ENV
            tag=$(date -u -d '+8 hour' '+%Y.%m.%d')
            echo "tag=$tag" >> $GITHUB_ENV
          fi

      - name: Checkout Code (if changed)
        uses: actions/checkout@v4
        if: ${{ env.isDiff }}
        with:
          ref: ${{ matrix.branch }}
          path: epg

      - uses: actions/setup-python@v5
        if: ${{ env.isDiff }}
        with:
          python-version: '3.12' 

      - name: Convert XML to JSON
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          mkdir -p ./xml ./json
          mv -f ../e.xml ./xml/e.xml
          pip install -r requirements.txt
          python xml2json.py

      - name: Move Files
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          now_date=$(date -u -d '+8 hour' '+%Y-%m-%d')
          mv -f ./xml/e.xml ./xml/${{ matrix.branch }}.xml
          mv -f ./json/e.json ./json/${{ matrix.branch }}.json
          echo "${{ env.isDiff }}" > ./md5.txt
          sleep ${{ matrix.sleep }}

      - uses: ncipollo/release-action@v1
        if: ${{ env.isDiff }}
        with:
          tag: ${{ env.tag }}
          body: "更新时间: ${{ env.now_time }}"
          allowUpdates: true
          artifacts: |
            epg/xml/*.xml
            epg/json/*.json

      - name: Save Files to Repository
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 确保 xml/json/old 目录存在
          mkdir -p xml json old
          
          # 定义下载基础 URL
          BASE_URL="https://github.com/celetor/epg/releases/download"
          # 定义日期范围 (例如：2024.02.14 到 2025.02.09)
          START_DATE="2024-02-14"
          END_DATE="2025-02-09"
          # 定义要下载的文件名
          FILES=("51zmt.json" "51zmt.xml")
          
          # 日期格式转换
          current_date="$START_DATE"
          while [[ "$current_date" != "$(date -I -d "$END_DATE + 1 day")" ]]; do
              formatted_date=$(date -d "$current_date" '+%Y.%m.%d')

              # 遍历每个文件，下载到 `old/`
              for file in "${FILES[@]}"; do
                  full_url="$BASE_URL/$formatted_date/$file"
                  echo "Downloading: $full_url"
                  
                  # 忽略 404 错误，继续执行
                  wget -c --retry-connrefused --waitretry=3 --timeout=30 --tries=5 -O "old/${formatted_date}-${file}" "$full_url" || true
              done
              
              # 递增日期
              current_date=$(date -I -d "$current_date + 1 day")
          done

          echo "All downloads completed!"

          # 复制文件并保留最新版本
          cp -f ./xml/${{ matrix.branch }}.xml ./xml/latest.xml
          cp -f ./json/${{ matrix.branch }}.json ./json/latest.json
          
          # 提交变更
          git add xml/*.xml json/*.json old/* md5.txt
          git commit -m "更新EPG数据: ${{ env.now_time }}" || true  # 忽略无变更错误
          git push origin ${{ matrix.branch }}

